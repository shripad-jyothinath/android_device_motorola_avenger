name: Build OrangeFox Recovery

on:
  workflow_dispatch:
  push:
    branches:
      - 'android-16'
    paths:
      - 'orangefox_avenger.mk'
      - 'orangefox_marvel.mk'
      - 'BoardConfig.mk'
      - 'device.mk'
      - 'common.mk'

jobs:
  build:
    name: Build OrangeFox by ${{ github.actor }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
    - name: Check Out
      uses: actions/checkout@v4

    - name: Cleanup Runner Space
      uses: rokibhasansagar/slimhub_actions@main

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: Prepare Build Environment
      run: |
        sudo apt-get update
        sudo apt-get -y upgrade
        sudo apt-get -y install gperf gcc-multilib g++-multilib libc6-dev lib32ncurses5-dev x11proto-core-dev libx11-dev tree lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc bc ccache lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libtinfo5 libsdl1.2-dev libxml2 lzop pngcrush schedtool squashfs-tools imagemagick libbz2-dev lzma ncftp qemu-user-static python-is-python3 python3 git curl zip

    - name: Setup Ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-ccache-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ccache-

    - name: Install OpenJDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '8'

    - name: Install Git-Repo
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Initialize Recovery Manifest
      run: |
        mkdir -p fox
        cd fox
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor }}@users.noreply.github.com"
        repo init --depth=1 -u https://gitlab.com/OrangeFox/sync.git -b 12.1 || repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1

    - name: Sync Source
      run: |
        cd fox
        repo sync -j$(nproc --all) --force-sync

    - name: Clone Device Tree
      run: |
        cd fox
        mkdir -p device/motorola hardware/motorola hardware/qcom-caf
        git clone https://github.com/${{ github.repository }}.git -b android-16 ./device/motorola/avenger
        ln -sf avenger ./device/motorola/marvel
        [ -d ./hardware/motorola ] || git clone https://github.com/LineageOS/android_hardware_motorola.git -b lineage-19.1 ./hardware/motorola
        [ -d ./hardware/qcom-caf/common ] || git clone https://github.com/LineageOS/android_hardware_qcom-caf_common.git -b lineage-19.1 ./hardware/qcom-caf/common
        cd device/motorola/avenger
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV

    - name: Build OrangeFox Recovery
      run: |
        cd fox
        export USE_CCACHE=1
        export CCACHE_DIR=~/.ccache
        ccache -M 10G
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export FOX_USE_TWRP_RECOVERY_IMAGE_BUILDER=1
        lunch orangefox_marvel-eng || lunch orangefox_avenger-eng || lunch omni_marvel-eng || lunch lineage_marvel-eng
        make clean
        make recoveryimage -j$(nproc --all)
        find out/target/product/ -maxdepth 2 -name "OrangeFox*.zip" -o -name "recovery.img" -exec cp {} ~/ \;
        echo "Done building OrangeFox recovery"

    - name: Set Properties
      run: |
        echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV
        echo -e \
        "
        ## OrangeFox Recovery R12.1 for Motorola Edge 70 Fusion (marvel / avenger)
        * Built with Standalone Device Tree
        * Status: Unofficial Test Build
        * Maintainer: Shripad
        " > changelog.txt

    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ~/OrangeFox*.zip
          ~/recovery.img
        name: OrangeFox Recovery R12.1 for Moto Edge 70 Fusion (${{ env.BUILD_DATE }})
        tag_name: ofox-${{ github.run_id }}
        body_path: changelog.txt

    - name: Live Debug Session on Failure
      if: failure()
      uses: mxschmitt/action-tmate@v3
      with:
        limit-access-to-actor: false
